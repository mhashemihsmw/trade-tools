[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "trade-tools"
version = "0.1.0"
description = "Market data infrastructure, portfolio optimization, and trade strategy toolkit"
authors = [
    { name = "Developer" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-mock = ">=3.12.0"
pytest-cov = ">=4.1.0"

[tool.poetry]
packages = [{include = "trade_tools", from = "src"}]

[tool.poetry.scripts]
trade-tools = "trade_tools.cli:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
