name: Portfolio Monitoring Refresh

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Refresh strategy backtest snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: poetry run trade-tools backtest run --universe-mode tradable

      - name: Generate static monitoring dashboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: poetry run trade-tools operations monitor-refresh

      - name: Upload monitoring dashboard
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-monitoring-${{ github.run_id }}
          path: reports/monitoring/index.html
          if-no-files-found: error
          retention-days: 90
