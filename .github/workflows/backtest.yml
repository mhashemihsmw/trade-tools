name: Research Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First decision date (YYYY-MM-DD)"
        required: false
        type: string
      end:
        description: "Last decision date (YYYY-MM-DD)"
        required: false
        type: string
      universe_mode:
        description: "Universe eligibility mode"
        required: true
        default: "tradable"
        type: choice
        options:
          - tradable
          - research
      include_holdout:
        description: "Include holdout results in the report"
        required: true
        default: false
        type: boolean

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run monthly backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
          UNIVERSE_MODE: ${{ inputs.universe_mode }}
          INCLUDE_HOLDOUT: ${{ inputs.include_holdout }}
        run: |
          args=(--universe-mode "$UNIVERSE_MODE")
          if [ -n "$START_DATE" ]; then args+=(--start "$START_DATE"); fi
          if [ -n "$END_DATE" ]; then args+=(--end "$END_DATE"); fi
          if [ "$INCLUDE_HOLDOUT" = "true" ]; then args+=(--include-holdout); fi
          poetry run trade-tools backtest run "${args[@]}"

      - name: Upload backtest run directory
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: reports/backtests/
          if-no-files-found: error
          retention-days: 90
