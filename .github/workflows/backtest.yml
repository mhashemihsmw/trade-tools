name: Research Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First decision date (YYYY-MM-DD)"
        required: false
        type: string
      end:
        description: "Last decision date (YYYY-MM-DD)"
        required: false
        type: string

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run monthly backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
        run: |
          set -o pipefail
          args=()
          if [ -n "$START_DATE" ]; then args+=(--start "$START_DATE"); fi
          if [ -n "$END_DATE" ]; then args+=(--end "$END_DATE"); fi
          poetry run trade-tools backtest "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload backtest run directory
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: reports/backtests/
          if-no-files-found: error
          retention-days: 90
