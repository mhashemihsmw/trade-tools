name: Monthly Research Signals

on:
  schedule:
    - cron: "0 8 1-3 * *"
  workflow_dispatch:
    inputs:
      decision_date:
        description: "Optional decision date (YYYY-MM-DD)"
        required: false
        type: string
      capital:
        description: "Total portfolio capital in the configured base currency"
        required: false
        type: string

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare report cache directory
        run: mkdir -p reports/monthly_signals

      - name: Restore prior month-end reports for idempotency
        uses: actions/cache@v4
        with:
          path: reports/monthly_signals
          key: monthly-signals-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            monthly-signals-${{ github.repository }}-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Refresh restated adjusted-price history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: poetry run trade-tools refresh-adjusted-history

      - name: Create month-end signals report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DECISION_DATE: ${{ inputs.decision_date }}
          CAPITAL: ${{ inputs.capital }}
        run: |
          args=()
          if [ -n "$DECISION_DATE" ]; then args+=(--date "$DECISION_DATE"); fi
          if [ -n "$CAPITAL" ]; then args+=(--capital "$CAPITAL"); fi
          poetry run trade-tools strategy monthly-report "${args[@]}"

      - name: Upload monthly report
        uses: actions/upload-artifact@v4
        with:
          name: monthly-signals-${{ github.run_id }}
          path: reports/monthly_signals/
          if-no-files-found: error
          retention-days: 90
